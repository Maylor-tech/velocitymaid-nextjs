<!-- @dsCard group="Colors" viewport="700x150" name="Semantic & Status" subtitle="Calm functional tints — never neon" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--vm-white);padding:20px;font-family:var(--font-body)}
  .row{display:flex;gap:12px}
  .sw{flex:1;border-radius:var(--radius-md);padding:12px;border:1px solid var(--border-default)}
  .dot{width:20px;height:20px;border-radius:50%;margin-bottom:10px}
  .name{font-family:var(--font-heading);font-weight:700;font-size:12px}
  .hex{font-size:11px;color:var(--vm-muted)}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--vm-success-bg)"><div class="dot" style="background:#1F8A5B"></div><div class="name" style="color:#1F8A5B">Success</div><div class="hex">#1F8A5B</div></div>
    <div class="sw" style="background:var(--vm-warning-bg)"><div class="dot" style="background:#B7791F"></div><div class="name" style="color:#B7791F">Warning</div><div class="hex">#B7791F</div></div>
    <div class="sw" style="background:var(--vm-danger-bg)"><div class="dot" style="background:#C0392B"></div><div class="name" style="color:#C0392B">Danger</div><div class="hex">#C0392B</div></div>
    <div class="sw" style="background:var(--vm-cyan-tint)"><div class="dot" style="background:#00C2CB"></div><div class="name" style="color:#00A8B0">Info</div><div class="hex">#00C2CB tint</div></div>
  </div>
</body></html>
