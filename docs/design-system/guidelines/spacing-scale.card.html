<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing Scale" subtitle="4px base grid" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--vm-white);padding:22px 24px;font-family:var(--font-body)}
  .row{display:flex;align-items:flex-end;gap:14px}
  .item{text-align:center}
  .bar{background:var(--vm-cyan);border-radius:3px;width:100%}
  .tok{font-size:10px;color:var(--vm-muted);margin-top:6px;white-space:nowrap}
</style></head>
<body>
  <div class="row">
    <div class="item" style="width:24px"><div class="bar" style="height:4px"></div><div class="tok">1·4</div></div>
    <div class="item" style="width:24px"><div class="bar" style="height:8px"></div><div class="tok">2·8</div></div>
    <div class="item" style="width:30px"><div class="bar" style="height:12px"></div><div class="tok">3·12</div></div>
    <div class="item" style="width:34px"><div class="bar" style="height:16px"></div><div class="tok">4·16</div></div>
    <div class="item" style="width:42px"><div class="bar" style="height:24px"></div><div class="tok">6·24</div></div>
    <div class="item" style="width:50px"><div class="bar" style="height:32px"></div><div class="tok">8·32</div></div>
    <div class="item" style="width:62px"><div class="bar" style="height:48px"></div><div class="tok">12·48</div></div>
    <div class="item" style="width:80px"><div class="bar" style="height:64px"></div><div class="tok">16·64</div></div>
    <div class="item" style="width:96px"><div class="bar" style="height:80px"></div><div class="tok">20·80</div></div>
  </div>
</body></html>
