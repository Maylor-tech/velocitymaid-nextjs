<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Surface, text, muted, white, border" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--vm-white);padding:20px;font-family:var(--font-body)}
  .row{display:flex;gap:12px}
  .sw{flex:1;border-radius:var(--radius-md);overflow:hidden;border:1px solid var(--border-default)}
  .chip{height:72px}
  .meta{padding:8px 10px}
  .name{font-family:var(--font-heading);font-weight:700;font-size:12px;color:var(--vm-navy)}
  .hex{font-size:11px;color:var(--vm-muted);font-variant-numeric:tabular-nums}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#F4F6F9"></div><div class="meta"><div class="name">Surface</div><div class="hex">#F4F6F9</div></div></div>
    <div class="sw"><div class="chip" style="background:#1A1A2E"></div><div class="meta"><div class="name">Text</div><div class="hex">#1A1A2E</div></div></div>
    <div class="sw"><div class="chip" style="background:#6B7280"></div><div class="meta"><div class="name">Muted</div><div class="hex">#6B7280</div></div></div>
    <div class="sw"><div class="chip" style="background:#FFFFFF"></div><div class="meta"><div class="name">White</div><div class="hex">#FFFFFF</div></div></div>
    <div class="sw"><div class="chip" style="background:#E2E8F0"></div><div class="meta"><div class="name">Border</div><div class="hex">#E2E8F0</div></div></div>
  </div>
</body></html>
