<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--vm-white);padding:20px 24px;font-family:var(--font-body)}
  .grid{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
  .cell{display:flex;flex-direction:column;align-items:center;gap:7px;width:74px}
  svg{width:26px;height:26px}
  .l{font-size:10px;color:var(--vm-muted)}
  .note{font-size:11px;color:var(--vm-muted);margin-top:14px}
</style></head>
<body>
  <div class="grid" id="grid"></div>
  <div class="note">Lucide icon set · 24×24, 2px stroke, rounded line caps. Tint navy or cyan; never multicolor.</div>
  <script>
    const P = {
      home:'<path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>',
      sparkles:'<path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .962 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.962 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/>',
      calendar:'<path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/>',
      clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
      'check-circle':'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
      star:'<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>',
      'map-pin':'<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
      user:'<path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>',
      truck:'<path d="M5 18H3c-.6 0-1-.4-1-1V7c0-.6.4-1 1-1h10c.6 0 1 .4 1 1v11"/><path d="M14 9h4l4 4v4c0 .6-.4 1-1 1h-2"/><circle cx="7" cy="18" r="2"/><path d="M15 18H9"/><circle cx="17" cy="18" r="2"/>'
    };
    const grid = document.getElementById('grid');
    Object.entries(P).forEach(([name, inner]) => {
      const cell = document.createElement('div'); cell.className = 'cell';
      cell.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#0F1C2E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${inner}</svg><span class="l">${name}</span>`;
      grid.appendChild(cell);
    });
  </script>
</body></html>
