<!-- @dsCard group="Spacing" viewport="700x150" name="Border Radius" subtitle="6 → 24px and pill" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--vm-white);padding:22px 24px;font-family:var(--font-body)}
  .row{display:flex;gap:18px;align-items:flex-end}
  .item{text-align:center}
  .box{width:72px;height:60px;background:var(--vm-cyan-tint);border:1.5px solid var(--vm-cyan)}
  .tok{font-size:11px;color:var(--vm-muted);margin-top:8px}
  .name{font-family:var(--font-heading);font-weight:700;font-size:12px;color:var(--vm-navy)}
</style></head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:6px"></div><div class="name">sm</div><div class="tok">6px · buttons</div></div>
    <div class="item"><div class="box" style="border-radius:8px"></div><div class="name">md</div><div class="tok">8px · cards</div></div>
    <div class="item"><div class="box" style="border-radius:12px"></div><div class="name">lg</div><div class="tok">12px · tiles</div></div>
    <div class="item"><div class="box" style="border-radius:16px"></div><div class="name">xl</div><div class="tok">16px · feature</div></div>
    <div class="item"><div class="box" style="border-radius:9999px"></div><div class="name">pill</div><div class="tok">badges · CTAs</div></div>
  </div>
</body></html>
