<!-- @dsCard group="Type" viewport="700x230" name="Type Scale" subtitle="12 → 60px modular scale" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--vm-white);padding:18px 24px;font-family:var(--font-body)}
  .r{display:flex;align-items:baseline;gap:16px;padding:3px 0}
  .t{font-family:var(--font-heading);font-weight:700;color:var(--vm-navy);line-height:1.1}
  .tok{font-size:11px;color:var(--vm-muted);font-family:var(--font-body);font-weight:500;width:120px;flex-shrink:0}
</style></head>
<body>
  <div class="r"><span class="tok">--text-6xl 60</span><span class="t" style="font-size:42px">Aa</span></div>
  <div class="r"><span class="tok">--text-4xl 36</span><span class="t" style="font-size:34px">Heading</span></div>
  <div class="r"><span class="tok">--text-2xl 24</span><span class="t" style="font-size:24px">Subhead</span></div>
  <div class="r"><span class="tok">--text-lg 18</span><span class="t" style="font-size:18px">Lead text</span></div>
  <div class="r"><span class="tok">--text-base 16</span><span class="t" style="font-size:16px;font-weight:500">Body base</span></div>
  <div class="r"><span class="tok">--text-sm 14</span><span class="t" style="font-size:14px;font-weight:500">Small / UI</span></div>
  <div class="r"><span class="tok">--text-xs 12</span><span class="t" style="font-size:12px;font-weight:500">Caption</span></div>
</body></html>
