<!-- @dsCard group="Colors" viewport="700x150" name="Primary Palette" subtitle="Navy · Cyan · Dark Cyan — the approved core" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--vm-white);padding:20px;font-family:var(--font-body)}
  .row{display:flex;gap:16px}
  .sw{flex:1;border-radius:var(--radius-lg);overflow:hidden;border:1px solid var(--border-default)}
  .chip{height:84px;display:flex;align-items:flex-end;padding:10px}
  .meta{padding:8px 10px}
  .name{font-family:var(--font-heading);font-weight:700;font-size:13px;color:var(--vm-navy)}
  .hex{font-size:12px;color:var(--vm-muted);font-variant-numeric:tabular-nums}
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#0F1C2E"></div><div class="meta"><div class="name">Navy</div><div class="hex">#0F1C2E · --vm-navy</div></div></div>
    <div class="sw"><div class="chip" style="background:#00C2CB"></div><div class="meta"><div class="name">Cyan</div><div class="hex">#00C2CB · --vm-cyan</div></div></div>
    <div class="sw"><div class="chip" style="background:#00A8B0"></div><div class="meta"><div class="name">Dark Cyan</div><div class="hex">#00A8B0 · --vm-cyan-dark</div></div></div>
  </div>
</body></html>
