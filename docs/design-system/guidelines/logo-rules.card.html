<!-- @dsCard group="Brand" viewport="700x180" name="Logo Clear Space & Misuse" subtitle="Protect the mark — never recolor or distort" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--vm-white);padding:20px 24px;font-family:var(--font-body);display:flex;gap:34px;align-items:center}
  .clear{position:relative;padding:22px;border:1px dashed var(--vm-cyan);border-radius:10px}
  .do,.dont{display:flex;flex-direction:column;gap:10px}
  .item{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--vm-text)}
  .ic{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;flex-shrink:0}
  .ok{background:#1F8A5B}.no{background:#C0392B}
  .h{font-family:var(--font-heading);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:0.14em;color:var(--vm-muted);margin-bottom:4px}
</style></head>
<body>
  <div>
    <div class="h">Clear space = height of the mark</div>
    <div class="clear"><img src="../../../public/brand/velocitymaid/velocitymaid-mark.png" width="56" height="56" alt="VelocityMaid mark"/></div>
  </div>
  <div class="do">
    <div class="h">Do</div>
    <div class="item"><span class="ic ok">✓</span> Use approved Final Approval Pack masters</div>
    <div class="item"><span class="ic ok">✓</span> Preserve aspect ratio and clear space</div>
    <div class="item"><span class="ic ok">✓</span> Use the VM mark for compact / favicon sizes</div>
  </div>
  <div class="dont">
    <div class="h">Don't</div>
    <div class="item"><span class="ic no">✕</span> Recolor outside navy / cyan / white</div>
    <div class="item"><span class="ic no">✕</span> Stretch, rotate, or add shadows</div>
    <div class="item"><span class="ic no">✕</span> Approximate with HTML / CSS / SVG</div>
  </div>
</body></html>
