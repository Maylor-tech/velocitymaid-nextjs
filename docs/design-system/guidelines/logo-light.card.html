<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--vm-white);padding:0;font-family:var(--font-body);height:150px;display:flex;align-items:center;justify-content:center;gap:40px}
  .lock{display:flex;align-items:center;gap:14px}
  .wm{display:flex;flex-direction:column;line-height:1}
  .name{font-family:var(--font-heading);font-weight:700;text-transform:uppercase;letter-spacing:0.04em;font-size:26px;color:var(--vm-navy)}
  .sub{font-weight:700;text-transform:uppercase;letter-spacing:0.2em;font-size:9px;color:var(--vm-muted);margin-top:5px}
</style></head>
<body>
  <div class="lock">
    <img src="../assets/logo/mark-navy.svg" width="44" height="44" alt="VelocityMaid mark"/>
    <div class="wm"><span class="name">VelocityMaid</span><span class="sub">Come home to clean.</span></div>
  </div>
  <img src="../assets/logo/mark-navy.svg" width="52" height="52" alt="VelocityMaid mark"/>
</body></html>
