<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><link rel="stylesheet" href="../styles.css"/>
<style>
  body{margin:0;background:var(--vm-white);padding:0;font-family:var(--font-body);height:150px;display:flex;align-items:center;justify-content:center;gap:30px}
  .cell{display:flex;flex-direction:column;align-items:center;gap:10px}
  .tok{font-size:10px;color:var(--vm-muted)}
  .dark{background:var(--vm-navy);border-radius:12px;padding:14px}
</style></head>
<body>
  <div class="cell"><img src="../assets/logo/mark-navy.svg" width="48" height="48"/><span class="tok">mark-navy</span></div>
  <div class="cell"><img src="../assets/logo/mark-navy-sm.svg" width="40" height="40"/><span class="tok">small ≤32px</span></div>
  <div class="cell"><img src="../assets/logo/mark-mono-navy.svg" width="44" height="44"/><span class="tok">mono navy</span></div>
  <div class="cell dark"><img src="../assets/logo/mark-white.svg" width="44" height="44"/><span class="tok" style="color:rgba(255,255,255,0.6)">on navy</span></div>
  <div class="cell"><img src="../assets/logo/favicon.svg" width="48" height="48"/><span class="tok">favicon</span></div>
</body></html>
